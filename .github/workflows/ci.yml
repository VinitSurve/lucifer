name: Lucifer CI Pipeline

on:
  push:
    branches: [main, master, "security/**"]
  pull_request:
    branches: [main, master, "security/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Monorepo Security & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Security Static Scan (Accidental Secrets & Tokens)
        run: |
          echo "Running static security checks for accidental secrets..."
          python3 -c '
          import os, re, sys
          from pathlib import Path

          PATTERNS = {
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "aws_key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "github_token": re.compile(r"gh[pousr]_[A-Za-z0-9_]{36,255}"),
              "telegram_token": re.compile(r"\b[0-9]{8,10}:[a-zA-Z0-9_-]{35}\b")
          }

          suspicious = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in [".git", "node_modules", ".venv", "dist", ".wrangler"]]
              for file in files:
                  filepath = Path(root) / file
                  if "test" in str(filepath).lower() or filepath.suffix in [".md", ".example"]:
                      continue
                  try:
                      content = filepath.read_text(encoding="utf-8", errors="ignore")
                      for name, pat in PATTERNS.items():
                          if pat.search(content):
                              if "redact" not in str(filepath).lower():
                                  suspicious.append(f"{filepath}: {name}")
                  except Exception:
                      pass

          if suspicious:
              print(f"CRITICAL: Potential secrets detected in non-test files:\n" + "\n".join(suspicious))
              sys.exit(1)
          print("Security static scan passed: zero accidental credentials detected.")
          '

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.9.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: 'latest'

      - name: Install Monorepo Dependencies
        run: |
          pnpm approve-builds --all
          pnpm install --frozen-lockfile

      - name: Lint and Typecheck TypeScript
        run: pnpm run lint

      - name: Build TypeScript Packages & Cloud Worker
        run: pnpm run build

      - name: Run TypeScript Tests
        run: pnpm run test

      - name: Run Python Agent Tests
        run: |
          cd apps/local-agent
          uv run pytest -v
