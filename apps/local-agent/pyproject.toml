[project]
name = "lucifer-agent"
version = "0.1.0"
description = "Project Lucifer - Local macOS Autonomous Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.scripts]
lucifer-agent = "lucifer_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucifer_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]
